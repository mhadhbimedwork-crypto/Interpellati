name: Elenco scuole B015-B017
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  elenco:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt openpyxl
      - run: python scraper/elenco_scuole.py
      - name: Salva
        if: always()
        run: |
          git config user.name "interpellati-bot"
          git config user.email "interpellati-bot@users.noreply.github.com"
          git add data/Elenco_scuole_B015_B017.xlsx data/elenco_scuole_report.txt || true
          if git diff --cached --quiet; then echo nessuna modifica; exit 0; fi
          git commit -m "dati: elenco scuole B015/B017"
          git pull --rebase origin main
          git push
