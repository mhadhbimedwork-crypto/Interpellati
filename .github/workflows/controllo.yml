name: Controllo completezza
on:
  workflow_dispatch:
  schedule:
    - cron: "30 7,13,19 * * *"
permissions:
  contents: write
concurrency:
  group: controllo
jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/controllo.py
      - name: Salva
        run: |
          git config user.name "interpellati-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/controllo.json data/controllo_buchi.txt; git diff --cached --quiet && exit 0
          git commit -q -m "dati: controllo completezza"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep $((i*5)); done; exit 1
