name: Recupero siti in errore
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recupero
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/recupero_errori.py
      - name: Salva
        if: always()
        run: |
          git config user.name "interpellati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/diagnosi_errori.json
          git diff --cached --quiet && exit 0
          git commit -q -m "dati: diagnosi siti in errore"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main || { git rebase --abort; git fetch -q origin main; git reset --soft origin/main; git commit -qm "dati: diagnosi siti in errore" || true; }
            git push -q && exit 0
            sleep $((i*7))
          done
          exit 1
