name: Miglioramento giornaliero e memoria
on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * *"
    - cron: "40 13 * * *"
permissions:
  contents: write
jobs:
  memoria:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: miglioramento-giornaliero
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Riprova le scuole in errore (le più vecchie per prime)
        env:
          MAX: "400"
        run: python scraper/ip_lenti.py && python scraper/recupero_errori.py
        continue-on-error: true
      - name: Memoria, elenco per l'app ed Excel colorato
        run: python scraper/memoria_scuole.py
      - name: Memoria avanzata (priorità di lettura) e prova di superamento
        run: |
          python memoria/aggiorna.py
          python memoria/esperimenti.py
        continue-on-error: true
      - name: Salva
        run: |
          git config user.name "interpellati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memoria/stato memoria/risultati data/priorita_lettura.json data/cms_report.json data/ip_lenti.json data/diagnosi_errori.json data/memoria_scuole.json data/memoria_progetto.json data/scuole_stato.json data/Elenco_scuole_Interpellati.xlsx
          git diff --cached --quiet && exit 0
          git commit -q -m "dati: memoria giornaliera delle scuole"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep $((i*5))
          done
          exit 1
