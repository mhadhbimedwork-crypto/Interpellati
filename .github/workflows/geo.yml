name: Coordinate scuole
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/geo.py
        env:
          GEO_BUDGET: "900"
      - name: Salva i dati
        run: |
          git config user.name "interpellati-bot"
          git config user.email "interpellati-bot@users.noreply.github.com"
          git add -A data ':!data/ultima_scansione.txt'
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          git commit -m "dati: coordinate $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
