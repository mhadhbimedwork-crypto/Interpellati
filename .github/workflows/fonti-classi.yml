name: Fonti classi di concorso
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scarica_testi.py
      - run: |
          git config user.name "interpellati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/fonti_classi
          git diff --cached --quiet && exit 0
          git commit -q -m "dati: testi delle tabelle delle classi di concorso"
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep $((i*5)); done
          exit 1
