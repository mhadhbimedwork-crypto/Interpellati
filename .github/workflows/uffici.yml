name: Uffici scolastici d'Italia
on:
  workflow_dispatch:
  schedule:
    - cron: "5,20,35,50 4-20 * * *"
permissions:
  contents: write
concurrency:
  group: uffici
  cancel-in-progress: true
jobs:
  scopri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt
      - name: Elenco uffici (una volta al giorno)
        run: |
          if [ -s data/uffici_ipa.json ] && [ -z "$(find data/uffici_ipa.json -mmin +1440)" ]; then echo "elenco recente"; exit 0; fi
          python scraper/uffici_ipa.py | tee /tmp/ipa.log | tail -60
        continue-on-error: true
      - name: Salva elenco
        run: |
          git config user.name "interpellati-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/uffici_ipa.json; git diff --cached --quiet && exit 0
          git commit -q -m "dati: elenco uffici scolastici"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep $((i*5)); done
  turno:
    needs: scopri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/uffici.py ${{ matrix.k }} 8
        continue-on-error: true
      - name: Salva
        if: always()
        run: |
          git config user.name "interpellati-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/scuole/uffici${{ matrix.k }}_trovati.json data/scuole/uffici${{ matrix.k }}_stato.json data/scuole/uffici${{ matrix.k }}_date.json data/scuole/uffici${{ matrix.k }}_log.txt; git diff --cached --quiet && exit 0
          git commit -q -m "dati: uffici turno ${{ matrix.k }}"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase -X theirs origin main || { git rebase --abort; git fetch -q origin main; git reset --soft origin/main; git commit -qm "dati: uffici (ricomposto)" || true; }; git push -q && exit 0; sleep $((i*7)); done; exit 1
