name: Scoperta uffici scolastici
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
jobs:
  scopri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/uffici_scopri.py | tee data/uffici_scopri.log
      - name: Salva
        if: always()
        run: |
          git config user.name "interpellati-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/uffici_scoperti.json data/uffici_scopri.log; git diff --cached --quiet && exit 0
          git commit -q -m "dati: uffici scoperti"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep $((i*5)); done; exit 1
