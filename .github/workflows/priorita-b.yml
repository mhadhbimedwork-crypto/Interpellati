name: Ricerca B015-B017
on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 4-21 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: prioritab
  cancel-in-progress: false
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Istituti B015/B017
        env:
          BUDGET_S: "1200"
        run: python scraper/priorita_b.py
        continue-on-error: true
      - name: Salva
        if: always()
        run: |
          git config user.name "interpellati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scuole/prioritaB_*
          git diff --cached --quiet && exit 0
          git commit -q -m "dati: ricerca B015/B017 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase -X theirs origin main || { git rebase --abort; git fetch -q origin main; git reset --soft origin/main; git commit -qm "dati: ricerca B015/B017 (ricomposto)" || true; }
            git push -q && exit 0
            sleep $((i*7))
          done
          exit 1
      - name: Prossimo giro (le esecuzioni programmate di GitHub vengono spesso saltate)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(date -u +%H)
          if [ "$h" -ge 4 ] && [ "$h" -le 21 ]; then
            sleep 120
            gh workflow run priorita-b.yml --ref main -R "$GITHUB_REPOSITORY" || true
          fi
