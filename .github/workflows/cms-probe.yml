name: Sonda feed e cache dei siti
on:
  workflow_dispatch:
  schedule:
    - cron: "10 2 * * 1"
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: cms-probe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/cms_probe.py
        env:
          BUDGET_S: "2700"
      - name: Salva
        if: always()
        run: |
          git config user.name "interpellati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cms_report.json
          git diff --cached --quiet && exit 0
          git commit -q -m "dati: sonda feed RSS e cache dei siti"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep $((i*5))
          done
          exit 1
