name: Geo probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scraper/geoprobe.py > /tmp/report.txt 2>&1 || true
      - name: Pubblica rapporto
        run: |
          git config user.name "interpellati-bot"
          git config user.email "interpellati-bot@users.noreply.github.com"
          git checkout --orphan geoprobe-report
          git rm -rf . -q
          cp /tmp/report.txt report.txt
          git add report.txt
          git commit -qm "rapporto geoprobe"
          git push -f origin geoprobe-report
