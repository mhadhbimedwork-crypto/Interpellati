name: Build APK
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Gradle assembleRelease
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Pubblica APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ../Interpellati.apk
          cd ..
          NOTE="Ultima versione compilata automaticamente dal commit ${GITHUB_SHA::7}. Scarica Interpellati.apk dal telefono e installalo."
          # La release e il tag vengono ricreati sul commit corrente: cosi' il tag non punta a vecchi commit.
          gh release delete apk -y --cleanup-tag || true
          gh release create apk Interpellati.apk --title "Interpellati – app Android" --notes "$NOTE" --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Interpellati-apk
          path: Interpellati.apk
      - name: Elimina gli artefatti delle vecchie esecuzioni
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
