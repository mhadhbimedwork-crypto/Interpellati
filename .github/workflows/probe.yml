name: Prova lettura avvisi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/probe.py | tee probe.log
      - name: Pubblica il rapporto su un ramo a parte
        run: |
          git config user.name "interpellati-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan probe-report
          git rm -rf -q --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/rep && cp probe.log /tmp/rep/probe.log
          git clean -fdxq
          cp /tmp/rep/probe.log probe.log
          git add probe.log
          git commit -q -m "rapporto di prova"
          git push -f origin probe-report
