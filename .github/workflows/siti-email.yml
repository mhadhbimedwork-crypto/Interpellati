name: Siti dal dominio email
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: siti-email
jobs:
  e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/siti_da_email.py
      - name: Salva
        if: always()
        run: |
          git config user.name "interpellati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scuole/*_corretti.json data/sicilia_siti_corretti.json
          git diff --cached --quiet && exit 0
          git commit -q -m "dati: siti recuperati dal dominio email"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep $((i*7))
          done
          exit 1
