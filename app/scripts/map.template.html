<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
/*LEAFLET_CSS*/
/*CLUSTER_CSS*/
html,body,#m{height:100%;margin:0;padding:0;background:#cfe3f1}
body.dark,body.dark #m{background:#27394a}
#msg{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:900;background:rgba(255,255,255,.95);color:#222;border-radius:8px;padding:5px 10px;font:12px -apple-system,Roboto,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.3);display:none;text-align:center;max-width:80%}
body.dark #msg{background:rgba(24,28,34,.95);color:#e6e9ee}
.leaflet-container{font:13px -apple-system,Roboto,sans-serif}
.dot{width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.dot.o{background:#1f9d55}.dot.s{background:#e08a00}.dot.x{background:#8a94a0}
.dot.c{border-style:solid;border-width:3px;outline:2px solid rgba(0,0,0,.25)}
.dot.p{background:transparent!important;border:3px dashed currentColor;box-shadow:none}
.dot.p.o{color:#1f9d55}.dot.p.s{color:#e08a00}.dot.p.x{color:#8a94a0}
.cl{position:relative;width:46px;height:46px}
.cl svg{position:absolute;inset:0;z-index:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.cl b{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font:700 14px -apple-system,Roboto,sans-serif;color:#111}
body.dark .cl b{color:#fff}
.sel .dot{transform:scale(1.35);outline:3px solid #1f5f8b}
#leg{position:absolute;left:8px;bottom:22px;z-index:800;background:rgba(255,255,255,.92);color:#222;border-radius:8px;padding:6px 8px;font:11px/1.5 -apple-system,Roboto,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.3)}
body.dark #leg{background:rgba(24,28,34,.92);color:#e6e9ee}
#leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-sizing:border-box}
#cnt{position:absolute;right:8px;top:8px;z-index:800;background:rgba(255,255,255,.92);color:#222;border-radius:8px;padding:4px 8px;font:600 12px -apple-system,Roboto,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.3)}
body.dark #cnt{background:rgba(24,28,34,.92);color:#e6e9ee}
</style></head>
<body>
<div id="m"></div>
<div id="cnt">0</div>
<div id="msg">Mappa stradale non disponibile (serve internet): confini delle province sempre visibili.</div>
<div id="leg"><i style="background:#1f9d55"></i>aperto <i style="background:#e08a00;margin-left:6px"></i>scade entro 48 h<br><i style="border:2px solid #555;background:#fff"></i>posizione precisa &nbsp;<i style="border:2px dashed #555"></i>solo provincia</div>
<script>/*LEAFLET_JS*/</script>
<script>/*CLUSTER_JS*/</script>
<script>var ITALIA=/*ITALIA*/;</script>
<script>
window.onerror=function(m,s,l){try{if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({type:'err',m:String(m)+' @'+l}));}catch(e){}};
(function(){
var COL={o:'#1f9d55',s:'#e08a00',x:'#8a94a0'};
function post(o){var s=JSON.stringify(o);if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(s);else if(window.__out)window.__out(o);}
var map=L.map('m',{zoomControl:true,attributionControl:true,zoomSnap:0.5,minZoom:4,maxZoom:18}).setView([42.2,12.6],6);
map.attributionControl.setPrefix(false);
var dark=false,tiles=null,base=null,okTiles=0,errTiles=0,usaOsm=false;
function drawBase(){
  if(base)map.removeLayer(base);
  base=L.layerGroup();
  var st={color:dark?'#8fa3b5':'#7a8a99',weight:0.6,fillColor:dark?'#3b4a58':'#f4f1e8',fillOpacity:1,interactive:false,smoothFactor:1};
  ITALIA.forEach(function(r){L.polygon(r,st).addTo(base);});
  base.addTo(map);base.eachLayer(function(l){if(l.bringToBack)l.bringToBack();});
}
function setTiles(){
  if(tiles)map.removeLayer(tiles);
  var url=usaOsm?'https://tile.openstreetmap.org/{z}/{x}/{y}.png':'https://{s}.basemaps.cartocdn.com/'+(dark?'dark_all':'light_all')+'/{z}/{x}/{y}{r}.png';
  tiles=L.tileLayer(url,{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap'+(usaOsm?'':', © CARTO'),crossOrigin:false});
  tiles.on('tileload',function(){okTiles++;document.getElementById('msg').style.display='none';if(base&&map.hasLayer(base))map.removeLayer(base);});
  tiles.on('tileerror',function(){errTiles++;if(errTiles===6&&!okTiles&&!usaOsm){usaOsm=true;setTiles();}});
  tiles.addTo(map);
}
setTimeout(function(){if(!okTiles){document.getElementById('msg').style.display='block';if(base&&!map.hasLayer(base))base.addTo(map);}},6000);
window.setTheme=function(d){dark=!!d;document.body.className=dark?'dark':'';drawBase();okTiles=0;setTiles();};
drawBase();setTiles();

function donut(o,s,x){
  var t=o+s+x,r=17,c=2*Math.PI*r,off=0,seg='';
  [[o,COL.o],[s,COL.s],[x,COL.x]].forEach(function(p){
    if(!p[0])return;var len=c*p[0]/t;
    seg+='<circle r="'+r+'" cx="23" cy="23" fill="none" stroke="'+p[1]+'" stroke-width="6" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 23 23)"/>';
    off+=len;
  });
  return '<div class="cl"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="'+(dark?'#14181d':'#fff')+'" opacity=".92"/>'+seg+'</svg><b>'+t+'</b></div>';
}
var group=L.markerClusterGroup({chunkedLoading:true,chunkInterval:80,chunkDelay:20,removeOutsideVisibleBounds:true,animate:false,maxClusterRadius:60,showCoverageOnHover:false,spiderfyOnMaxZoom:true,zoomToBoundsOnClick:false,
  iconCreateFunction:function(cl){
    var o=0,s=0,x=0;cl.getAllChildMarkers().forEach(function(m){var k=m.options.st;if(k==='s')s++;else if(k==='x')x++;else o++;});
    return L.divIcon({html:donut(o,s,x),className:'',iconSize:[46,46]});
  }});
map.addLayer(group);
var byId={},selected=null,loadGen=0;
group.on('clusterclick',function(e){
  var cl=e.layer,b=cl.getBounds(),ch=cl.getAllChildMarkers();
  if(b.getNorthEast().distanceTo(b.getSouthWest())<8){post({type:'select',ids:ch.slice(0,80).map(function(m){return m.options.id;})});}
  else map.fitBounds(b,{padding:[40,40],maxZoom:17});
});
function view(){
  var b=map.getBounds(),ids=[];
  group.eachLayer(function(m){if(b.contains(m.getLatLng()))ids.push(m.options.id);});
  document.getElementById('cnt').textContent=ids.length+' in questa zona';
  post({type:'view',n:ids.length,ids:ids.slice(0,150)});
}
map.on('moveend',view);
window.setData=function(arr,fit){
  group.clearLayers();byId={};
  var pts=[],ms=[];
  arr.forEach(function(d){
    var ic=L.divIcon({className:'',html:'<div class="dot '+d.st+' '+d.g+'"></div>',iconSize:[18,18]});
    var m=L.marker([d.lat,d.lon],{icon:ic,id:d.id,st:d.st,keyboard:false});
    m.on('click',function(){post({type:'select',ids:[d.id]});});
    byId[d.id]=m;ms.push(m);pts.push([d.lat,d.lon]);
  });
  if(fit&&pts.length){map.fitBounds(pts,{padding:[30,30],maxZoom:11,animate:false});}
  var gen=++loadGen;
  group.addLayers(ms);
  // con il caricamento a blocchi i marker arrivano un po' alla volta: aggiorno il conteggio alla fine
  var tries=0;(function wait(){if(gen!==loadGen)return;if(group.getLayers().length>=ms.length||++tries>200){view();}else setTimeout(wait,100);})();
};
window.focusId=function(id){var m=byId[id];if(!m)return;map.setView(m.getLatLng(),Math.max(map.getZoom(),15),{animate:true});};
post({type:'ready'});
})();
</script></body></html>
